<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <linearGradient id="techAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Shield Shape -->
  <path d="M32 4L54 12V30C54 44.5 44.5 55.5 32 60C19.5 55.5 10 44.5 10 30V12L32 4Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Cybernetic Lines -->
  <path d="M32 12V52" stroke="#0066FF" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6" />
  <path d="M20 22L32 16L44 22" stroke="url(#techAccent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stylized Modern 'D' Monogram in Center -->
  <path d="M25 24V40C25 40 28 41 33 41C38 41 41 37.5 41 32C41 26.5 38 23 33 23C28 23 25 24 25 24Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Security Core Node -->
  <circle cx="32" cy="32" r="3" fill="#F5A623" />
  <circle cx="32" cy="32" r="5" stroke="#F5A623" stroke-width="1" opacity="0.6" />
</svg>
