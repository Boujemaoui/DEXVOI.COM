<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Perímetro No Encontrado | DEXVOI</title>
  <meta name="description" content="El recurso o página solicitada no existe o ha sido reubicada dentro de la infraestructura de Dexvoi.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070A12;
      color: #E2E8F0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #FB7185;
      font-family: monospace;
      font-size: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background-color: #F43F5E;
    }
    h1 {
      font-size: clamp(3.5rem, 8vw, 6rem);
      font-family: monospace;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 span { color: #F43F5E; }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #F1F5F9;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94A3B8;
      max-width: 32rem;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #FFFFFF;
      color: #070A12;
    }
    .btn-primary:hover {
      background: #E2E8F0;
    }
    .btn-secondary {
      background: #0F172A;
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .btn-secondary:hover {
      background: #1E293B;
      border-color: rgba(56, 189, 248, 0.6);
    }
    .brand {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      font-family: monospace;
      font-weight: 800;
      font-size: 1.1rem;
      color: #FFFFFF;
      letter-spacing: 0.05em;
    }
    .brand span { color: #F5A623; }
  </style>
</head>
<body>
  <div class="brand">DEX<span>VOI</span></div>

  <div class="badge">
    <span class="badge-dot"></span>
    <span>CÓDIGO_ESTADO // 404_NO_ENCONTRADO</span>
  </div>

  <h1>4<span>0</span>4</h1>
  <h2>Perímetro No Encontrado</h2>
  <p>La ruta o recurso digital solicitado no existe en nuestros servidores o ha sido reubicada bajo nuevos protocolos de seguridad.</p>

  <div class="btn-group">
    <a href="/" class="btn btn-primary">Volver al Inicio</a>
    <a href="/servicios" class="btn btn-secondary">Nuestros Servicios</a>
    <a href="/auditoria-seguridad" class="btn btn-secondary">Auditoría OSINT</a>
    <a href="/blog" class="btn btn-secondary">Blog Técnico</a>
  </div>

  <script>
    // If the browser loaded this 404.html directly on an SPA route, redirect smoothly to the SPA entry point
    if (window.location.pathname !== '/404' && window.location.pathname !== '/404.html') {
      // Store requested path in sessionStorage so SPA router can navigate there
      try {
        sessionStorage.setItem('dexvoi_redirect_path', window.location.pathname + window.location.search);
      } catch (e) {}
      window.location.replace('/?p=' + encodeURIComponent(window.location.pathname + window.location.search));
    }
  </script>
</body>
</html>
